<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REBELTV Streaming App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #111827; /* Dark background */
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 1200px;
      margin: auto;
    }

    #main-content {
      display: flex;
      flex-grow: 1;
      overflow: hidden;
    }

    #left-panel {
      width: 40%;
      display: flex;
      flex-direction: column;
    }

    #right-panel {
      width: 60%;
      padding-left: 1.5rem;
    }

    #channel-list {
      flex-grow: 1;
      overflow-y: auto;
    }

    video {
      width: 100%;
      border-radius: 0.5rem;
      background-color: #000;
    }

    .channel-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem;
      border-radius: 0.375rem;
      background-color: #1f2937; /* Darker card background */
      transition: background-color 0.3s ease;
    }

    .channel-card:hover {
      background-color: #374151; /* Hover effect */
    }

    .channel-logo {
      width: 40px;
      height: 40px;
      margin-right: 0.75rem;
      border-radius: 50%;
      object-fit: cover;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      border-radius: 0.375rem;
      background-color: transparent;
      color: #9ca3af;
      transition: color 0.3s;
    }

    .icon-btn:hover {
      color: white;
    }
  </style>
</head>
<body class="text-white">
  <div id="app-container">
    <header class="p-4 text-center">
      <h1 class="text-3xl font-bold"><i class="fas fa-satellite-dish mr-2"></i>REBELTV</h1>
    </header>

    <div id="main-content" class="p-4">
      <div id="left-panel">
        <div class="relative mb-4">
          <input 
            id="search-channels"
            type="text" 
            placeholder="Search channel..."
            class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 pl-10" />
          <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
        </div>
        <div class="mb-4">
          <label for="new-stream-url" class="block text-sm font-medium text-gray-400 mb-2">Add New Stream URL</label>
          <div class="flex gap-2">
            <input
              id="new-stream-url"
              type="text"
              placeholder="e.g., https://example.com/stream.m3u8"
              class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2" />
            <button
              id="add-stream-btn"
              class="icon-btn bg-blue-500 hover:bg-blue-600 text-white">
              <i class="fas fa-plus"></i>
            </button>
          </div>
        </div>
        <h2 class="text-xl font-semibold mb-2">Channels (<span id="channel-count">0</span>)</h2>
        <div id="channel-list">
          <!-- Channels dynamically populated -->
        </div>
      </div>

      <div id="right-panel">
        <video id="video-player" controls></video>
      </div>
    </div>
  </div>

  <!-- EPG Modal -->
  <div id="epg-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden">
    <div class="bg-gray-800 p-6 rounded-lg max-w-lg w-full">
      <h2 class="text-2xl font-bold mb-4" id="epg-channel-name"></h2>
      <div id="epg-guide" class="overflow-y-auto max-h-96"></div>
      <button id="close-epg-modal" class="mt-4 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
