<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Channel Browser</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://vjs.zencdn.net/7.15.4/video-js.css" rel="stylesheet" />
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --background-color: #f0f2f5;
            --card-background: #ffffff;
            --text-color: #333333;
            --light-text-color: #777777;
            --border-color: #dddddd;
            --shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        body.dark-theme {
            --primary-color: #3498db;
            --secondary-color: #ecf0f1;
            --background-color: #2c3e50;
            --card-background: #34495e;
            --text-color: #ecf0f1;
            --light-text-color: #bdc3c7;
            --border-color: #4a6278;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 280px;
            background-color: var(--card-background);
            padding: 30px;
            box-shadow: 3px 0 10px rgba(0,0,0,0.05);
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        #sidebar h2 {
            color: var(--primary-color);
            margin-top: 0;
            font-size: 1.5em;
            display: flex;
            align-items: center;
        }

        #sidebar h2 .fa-filter {
            margin-right: 10px;
        }

        #search-bar {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 1em;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: border-color 0.3s;
        }

        #search-bar:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .filter-group {
            margin-bottom: 25px;
        }

        .filter-group h3 {
            margin-top: 0;
            font-size: 1.2em;
            color: var(--secondary-color);
            margin-bottom: 15px;
        }

        .filter-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        .theme-switcher {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            background-color: var(--background-color);
        }

        .theme-switcher .fa-sun, .theme-switcher .fa-moon {
            font-size: 20px;
        }
        
        body.dark-theme .theme-switcher .fa-sun { display: none; }
        body:not(.dark-theme) .theme-switcher .fa-moon { display: none; }

        #main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        #main-content h1 {
            color: var(--secondary-color);
            font-size: 2em;
            margin-bottom: 20px;
        }

        #channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .channel-card {
            background-color: var(--card-background);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid var(--border-color);
        }

        .channel-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .channel-logo-container {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f8f8;
            border-bottom: 1px solid var(--border-color);
        }

        .channel-logo {
            max-width: 75%;
            max-height: 75%;
        }

        .channel-info {
            padding: 20px;
        }

        .channel-name {
            font-weight: 600;
            font-size: 1.1em;
            margin: 0 0 10px;
        }

        .channel-category {
            font-size: 0.95em;
            color: var(--light-text-color);
        }

        #player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        #player-container {
            width: 85%;
            max-width: 1000px;
            background-color: #000;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        #close-player {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 30px;
            color: #fff;
            cursor: pointer;
            transition: transform 0.3s;
            z-index: 10;
        }

        #close-player:hover {
            transform: scale(1.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div>
                <h2><i class="fas fa-filter"></i> Filters</h2>
                <input type="text" id="search-bar" placeholder="Search channels...">
                <div class="filter-group">
                    <h3>Category</h3>
                    <select id="category-filter">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="filter-group">
                    <h3>Country</h3>
                    <select id="country-filter">
                        <option value="">All Countries</option>
                    </select>
                </div>
                <div class="filter-group">
                    <h3>Language</h3>
                    <select id="language-filter">
                        <option value="">All Languages</option>
                    </select>
                </div>
            </div>
            <div class="theme-switcher" id="theme-switcher">
                <i class="fas fa-sun"></i>
                <i class="fas fa-moon"></i>
            </div>
        </aside>
        <main id="main-content">
            <h1>IPTV Channel Browser</h1>
            <div id="channel-grid"></div>
        </main>
    </div>
    <div id="player-overlay">
        <div id="player-container">
            <span id="close-player">&times;</span>
            <video id="video-player" class="video-js vjs-default-skin" controls autoplay preload="auto" data-setup='{}'>
            </video>
        </div>
    </div>
    <script src="https://vjs.zencdn.net/7.15.4/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="app.js"></script>
</body>
</html>
