<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBELTV Streaming App</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --background-dark: #1a202c;
            --sidebar-dark: #111827;
            --text-dark: #f7fafc;
            --background-light: #f7fafc;
            --sidebar-light: #ffffff;
            --text-light: #1a202c;
            --primary-color: #3b82f6;
        }
        body {
            background-color: var(--background-dark);
            color: var(--text-dark);
        }
        aside {
            background-color: var(--sidebar-light);
            color: var(--text-light);
        }
        .dark-theme {
            background-color: var(--background-dark);
            color: var(--text-dark);
        }
        .dark-theme aside {
            background-color: var(--sidebar-dark);
            color: var(--text-dark);
        }
    </style>
</head>
<body class="dark-theme">
    <div id="loading-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50">
        <div class="animate-spin rounded-full h-32 w-32 border-t-2 border-b-2 border-blue-500"></div>
    </div>

    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 flex flex-col border-r">
            <div class="flex items-center justify-center h-16 border-b">
                <i class="fas fa-satellite-dish text-3xl text-blue-500"></i>
                <h1 class="text-2xl font-bold ml-2">REBELTV</h1>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="flex items-center p-2 text-base font-normal rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700">
                    <i class="fas fa-home w-6 h-6"></i>
                    <span class="ml-3">Home</span>
                </a>
                <a href="#" class="flex items-center p-2 text-base font-normal rounded-lg bg-gray-200 dark:bg-gray-700">
                    <i class="fas fa-tv w-6 h-6"></i>
                    <span class="ml-3">Live TV</span>
                </a>
                <div class="pt-4 mt-4 space-y-2 border-t">
                    <h3 class="text-xs font-semibold uppercase text-gray-500">Categories</h3>
                    <div id="category-filters" class="space-y-1">
                        <!-- Category filters will be populated here -->
                    </div>
                </div>
            </nav>
            <div class="p-4 border-t">
                <div class="flex items-center justify-between">
                    <span id="theme-label">Theme</span>
                    <div id="theme-toggle" class="cursor-pointer">
                        <i class="fas fa-moon"></i>
                    </div>
                </div>
                <button id="install-button" class="hidden mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    Install App
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex flex-col flex-1">
            <header class="flex items-center justify-between h-16 px-6 border-b">
                <div class="flex items-center">
                    <i class="fas fa-search text-gray-400"></i>
                    <input id="search-channels" type="text" placeholder="Search for channels..." class="ml-2 bg-transparent focus:outline-none">
                </div>
                <div class="flex items-center">
                    <button id="add-stream-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                        Add Stream
                    </button>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto p-6">
                <div id="video-section" class="mb-6">
                    <video id="video-player" controls class="w-full rounded-lg"></video>
                </div>
                <div id="channel-guide">
                    <!-- Channel guide will be populated here -->
                </div>
            </main>
        </div>
    </div>

    <!-- Add Stream Modal -->
    <div id="add-stream-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg">
            <h2 class="text-xl font-bold mb-4">Add Custom Stream</h2>
            <input id="stream-url-input" type="text" placeholder="Enter stream URL" class="w-full p-2 mb-4 rounded-md bg-gray-200 dark:bg-gray-700">
            <div class="flex justify-end">
                <button id="cancel-stream-btn" class="mr-2 px-4 py-2 rounded-md">Cancel</button>
                <button id="confirm-stream-btn" class="px-4 py-2 bg-blue-600 text-white rounded-md">Add</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
