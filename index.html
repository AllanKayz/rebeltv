<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REBELTV Streaming App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --primary-color: #3b82f6;
      --background-dark: #0f172a;
      --text-dark: #f1f5f9;
      --background-light: #f8fafc;
      --text-light: #0f172a;
      --card-background-dark: #1e293b;
      --card-border-dark: #334155;
      --card-background-light: #ffffff;
      --card-border-light: #e2e8f0;
    }

    * {
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    html, body {
      height: 100vh;
      margin: 0;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
    }

    body.dark {
      background-color: var(--background-dark);
      color: var(--text-dark);
    }

    body.light {
      background-color: var(--background-light);
      color: var(--text-light);
    }

    #app-container {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    .loading-indicator {
      text-align: center;
      padding: 1rem;
      color: #9ca3af;
    }

    video {
      width: 100%;
      height: auto;
      border-radius: 0.75rem;
      background-color: #000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    #channel-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1rem;
    }

    .channel-card {
      background-color: var(--card-background-dark);
      border: 1px solid var(--card-border-dark);
      border-radius: 0.5rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .light .channel-card {
      background-color: var(--card-background-light);
      border: 1px solid var(--card-border-light);
    }

    .channel-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .dark .channel-card:hover {
      border-color: var(--primary-color);
    }

    .light .channel-card:hover {
      border-color: var(--primary-color);
    }

    .channel-card.active {
      border: 2px solid var(--primary-color);
    }

    .channel-logo {
      width: 64px;
      height: 64px;
      border-radius: 0.5rem;
      object-fit: contain;
      margin-bottom: 0.5rem;
    }

    .channel-name {
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .dark .input-field {
      background-color: var(--card-background-dark);
      border: 1px solid var(--card-border-dark);
      color: var(--text-dark);
    }

    .light .input-field {
      background-color: var(--card-background-light);
      border: 1px solid var(--card-border-light);
      color: var(--text-light);
    }

    .input-field:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .theme-toggle {
      width: 60px;
      height: 30px;
      background-color: #475569;
      border-radius: 15px;
      position: relative;
      cursor: pointer;
    }

    .theme-toggle-slider {
      width: 26px;
      height: 26px;
      background-color: white;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.3s ease;
    }

    .theme-toggle.active .theme-toggle-slider {
      transform: translateX(30px);
    }

    .light .theme-toggle {
      background-color: #fbbf24;
    }

    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
    }

    .dark .scrollbar-thin::-webkit-scrollbar-track {
      background: var(--card-background-dark);
    }

    .light .scrollbar-thin::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    .dark .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }

    .light .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    .dark .modal-bg {
      background-color: var(--card-background-dark);
    }

    .light .modal-bg {
      background-color: var(--card-background-light);
    }

    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .channel-card:hover .card-overlay {
      opacity: 1;
    }

    .icon-btn {
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .icon-btn:hover {
      background-color: var(--primary-color);
    }
  </style>
</head>
<body class="dark">
  <div id="app-container">
    <!-- Header -->
    <header class="sticky top-0 z-50 backdrop-blur-lg border-b dark:border-gray-700 light:border-gray-200" style="background-color: rgba(15, 23, 42, 0.8);">
      <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center space-x-3">
            <i class="fas fa-satellite-dish text-3xl text-blue-500"></i>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-500 to-purple-600 bg-clip-text text-transparent">REBELTV</h1>
          </div>
          
          <div class="flex-1 flex justify-center px-4">
            <div class="w-full max-w-md">
              <div class="relative">
                <input
                  id="search-channels"
                  type="text"
                  placeholder="Search for channels..."
                  class="w-full input-field rounded-full py-2 px-4 pl-10" />
                <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
              </div>
            </div>
          </div>

          <div class="flex items-center space-x-4">
            <span class="text-sm hidden sm:inline" id="theme-label">Dark Mode</span>
            <div class="theme-toggle" id="theme-toggle">
              <div class="theme-toggle-slider"></div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-screen-2xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <div id="main-content" class="relative flex flex-col xl:flex-row gap-6">
        <div id="loading-overlay" class="absolute inset-0 bg-gray-900 bg-opacity-80 flex items-center justify-center z-50">
          <div class="text-center">
            <i class="fas fa-circle-notch fa-spin text-5xl text-blue-500"></i>
            <p class="mt-4 text-lg">Loading Channels...</p>
          </div>
        </div>
        
        <!-- Video Section -->
        <div id="video-section" class="w-full xl:w-2/3 xl:sticky top-24 self-start">
          <div id="video-container" class="rounded-xl overflow-hidden shadow-2xl">
            <video id="video-player" class="aspect-video" controls></video>
          </div>
          
          <!-- Now Playing Info Card -->
          <div class="mt-4 p-4 rounded-lg dark:bg-gray-800 light:bg-white" id="now-playing-card">
            <h3 class="font-semibold text-xl mb-1" id="now-playing-title">Select a channel</h3>
            <p class="text-sm opacity-75" id="now-playing-description">Start by choosing a channel from the list</p>
          </div>
        </div>

        <!-- Channels Section -->
        <div id="channels-section" class="w-full xl:w-1/3">
          <!-- Add Stream -->
          <div class="mb-4 p-4 rounded-lg border dark:border-gray-700 light:border-gray-200" id="add-stream-container">
            <label class="block text-sm font-semibold mb-2">
              <i class="fas fa-plus-circle mr-2"></i>Add Custom Stream URL
            </label>
            <div class="flex gap-2">
              <input
                id="new-stream-url"
                type="text"
                placeholder="https://example.com/stream.m3u8"
                class="flex-1 input-field rounded-lg p-2 text-sm" />
              <button
                id="add-stream-btn"
                class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors font-semibold">
                Add
              </button>
            </div>
          </div>

          <!-- Channel List -->
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-xl font-bold">
              Channels (<span id="channel-count">0</span>)
            </h2>
          </div>
          
          <div id="channel-list-container" class="overflow-y-auto scrollbar-thin pr-2" style="max-height: calc(100vh - 250px);">
            <div id="channel-list">
              <!-- Grid of channels will be populated here -->
              <div class="loading-indicator"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t py-4 dark:border-gray-700 light:border-gray-200">
      <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm opacity-60">
        <p>&copy; 2025 REBELTV. All rights reserved.</p>
      </div>
    </footer>
  </div>

  <!-- EPG Modal -->
  <div id="epg-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50">
    <div class="modal-bg p-6 rounded-xl max-w-2xl w-full mx-4 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl font-bold" id="epg-channel-name"></h2>
        <button id="close-epg-modal" class="text-gray-400 hover:text-white text-2xl">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="epg-guide" class="overflow-y-auto scrollbar-thin" style="max-height: 400px;"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Theme Toggle
    const themeToggle = document.getElementById('theme-toggle');
    const themeLabel = document.getElementById('theme-label');
    const body = document.body;
    const header = document.querySelector('header');

    // Load saved theme
    const savedTheme = localStorage.getItem('theme') || 'dark';
    setTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
      const currentTheme = body.classList.contains('dark') ? 'dark' : 'light';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      setTheme(newTheme);
      localStorage.setItem('theme', newTheme);
    });

    function setTheme(theme) {
      if (theme === 'light') {
        body.classList.remove('dark');
        body.classList.add('light');
        themeToggle.classList.add('active');
        themeLabel.textContent = 'Light Mode';
        header.style.backgroundColor = 'rgba(248, 250, 252, 0.8)';
      } else {
        body.classList.remove('light');
        body.classList.add('dark');
        themeToggle.classList.remove('active');
        themeLabel.textContent = 'Dark Mode';
        header.style.backgroundColor = 'rgba(15, 23, 42, 0.8)';
      }
    }
  </script>
</body>
</html>
