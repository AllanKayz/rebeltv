<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REBELTV Streaming App</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e5a00d">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body.dark {
        --primary-color: #e5a00d;
        --background-color: #141414;
        --text-color: #ffffff;
        --card-background-color: #1f1f1f;
    }
    body.light {
        --primary-color: #e5a00d;
        --background-color: #ffffff;
        --text-color: #000000;
        --card-background-color: #f0f0f0;
    }
    body {
        background-color: var(--background-color);
        color: var(--text-color);
    }
    .channel-card {
      flex: 0 0 auto;
      width: 180px;
      height: 270px;
      transition: transform 0.3s;
      background-color: var(--card-background-color);
    }
    .channel-card:hover {
      transform: scale(1.05);
    }
    .category-row {
      display: flex;
      overflow-x: auto;
      padding-bottom: 1rem;
    }
    .category-row::-webkit-scrollbar {
      display: none;
    }
    #video-player-container {
        position: sticky;
        top: 4rem; /* Height of the header */
        z-index: 40; /* Below the header */
    }
    .bg-primary-color {
        background-color: var(--primary-color);
    }
    #epg-modal {
        background-color: rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body class="dark font-sans">
  <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
    <div class="animate-spin rounded-full h-32 w-32 border-t-2 border-b-2 border-primary-color"></div>
  </div>
  <div id="app-container" class="flex flex-col min-h-screen">
    <header class="bg-black bg-opacity-80 sticky top-0 z-50">
      <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center space-x-3">
            <h1 class="text-3xl font-bold text-primary-color" style="color: var(--primary-color);">REBELTV</h1>
          </div>
          <div class="flex items-center space-x-4">
            <button id="epg-button" class="bg-primary-color hover:bg-opacity-80 text-white font-bold py-1 px-3 rounded-md">EPG</button>
            <button id="install-button" class="hidden bg-primary-color hover:bg-opacity-80 text-white font-bold py-1 px-3 rounded-md">Install App</button>
            <input id="search-channels" type="text" placeholder="Search..." class="bg-transparent border border-gray-600 rounded-md py-1 px-3 focus:outline-none focus:border-primary-color">
            <div id="theme-toggle" class="cursor-pointer">
              <i class="fas fa-sun text-2xl"></i>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 p-4">
        <div id="video-player-container" class="hidden w-full mb-8">
            <video id="video-player" class="w-full" controls autoplay></video>
        </div>

        <div id="add-stream-section" class="mb-8">
            <div class="flex space-x-2">
                <input id="new-stream-url" type="text" placeholder="Add custom stream URL" class="flex-grow bg-transparent border border-gray-600 rounded-md py-2 px-4 focus:outline-none focus:border-primary-color">
                <button id="add-stream-btn" class="bg-primary-color hover:bg-opacity-80 text-white font-bold py-2 px-4 rounded-md">Add Stream</button>
            </div>
        </div>

        <div id="channels-container" class="space-y-8">
            <!-- Categories and channels will be dynamically inserted here -->
        </div>
        <button id="load-more-btn" class="w-full mt-4 bg-primary-color hover:bg-opacity-80 text-white font-bold py-2 px-4 rounded-md">Load More</button>
    </main>
  </div>

  <!-- EPG Modal -->
  <div id="epg-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
    <div class="bg-card-background-dark rounded-lg shadow-lg p-6 w-11/12 h-5/6 relative">
        <button id="close-epg-modal" class="absolute top-2 right-2 text-2xl">&times;</button>
        <div id="epg-content" class="h-full overflow-auto"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(registration => {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }, err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
