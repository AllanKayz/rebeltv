<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="webmanifest.json">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512x512.png">
  <title>REBELTV | Premium IPTV Browser</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="src/design-system.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://vjs.zencdn.net/7.15.4/video-js.css" rel="stylesheet" />
  <link href="dist/output.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 font-sans transition-colors duration-300">
  <div id="app" class="flex flex-col lg:flex-row h-screen overflow-hidden">

    <!-- Mobile Header -->
    <header
      class="lg:hidden flex items-center justify-between p-4 glass-panel bg-white/80 dark:bg-slate-900/80 sticky top-0 z-40">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-primary to-blue-400 bg-clip-text text-transparent">REBELTV
      </h1>
      <button id="mobile-menu-toggle" class="p-2 text-slate-600 dark:text-slate-300 focus:outline-none"
        aria-label="Toggle Menu">
        <i class="fas fa-bars text-xl"></i>
      </button>
    </header>

    <!-- Sidebar -->
    <aside id="sidebar"
      class="fixed inset-y-0 left-0 z-50 lg:relative lg:translate-x-0 hidden-mobile lg:flex flex-col glass-panel bg-white/90 dark:bg-slate-900/95 p-6 shadow-2xl lg:shadow-none overflow-y-auto">

      <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-primary to-blue-400 bg-clip-text text-transparent">REBELTV
        </h1>
        <div class="flex items-center gap-2">
          <button id="collapse-sidebar" class="hidden lg:flex p-2 text-slate-500 hover:text-primary transition-colors"
            title="Collapse Sidebar">
            <i class="fas fa-chevron-left"></i>
          </button>
          <button id="close-mobile-menu" class="lg:hidden p-2 text-slate-500" aria-label="Close Menu">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>

      <!-- Custom Streams Section -->
      <div class="mb-8">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Custom Streams</h2>
          <button id="toggle-add-stream" class="text-primary hover:text-blue-600 transition" title="Add new stream">
            <i class="fas fa-plus-circle"></i>
          </button>
        </div>

        <form id="custom-stream-form" class="space-y-3 mb-6 hidden animate-fadeIn">
          <input type="text" id="custom-stream-name" placeholder="Name (e.g. My Channel)" title="Stream Name"
            aria-label="Stream Name"
            class="w-full p-2.5 bg-slate-100 dark:bg-slate-800 border border-transparent focus:border-primary/50 rounded-xl focus:outline-none transition-all text-sm">
          <input type="url" id="custom-stream-url" placeholder="URL (.m3u8, .mp4)" title="Stream URL"
            aria-label="Stream URL"
            class="w-full p-2.5 bg-slate-100 dark:bg-slate-800 border border-transparent focus:border-primary/50 rounded-xl focus:outline-none transition-all text-sm"
            required>
          <button type="submit"
            class="w-full py-2.5 bg-primary hover:bg-primary-hover text-white font-semibold rounded-xl transition-all shadow-lg shadow-primary/20 hover:shadow-primary/30 text-sm">
            Add Stream
          </button>
        </form>

        <div id="custom-streams-list" class="space-y-2 max-h-48 overflow-y-auto pr-2">
          <!-- Custom streams appear here -->
        </div>
      </div>

      <div class="h-px bg-slate-200 dark:bg-slate-800 my-6"></div>

      <!-- Browse Section -->
      <div class="space-y-6">
        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Browse Channels</h2>

        <div class="relative group">
          <i
            class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors"></i>
          <input type="text" id="search-bar" placeholder="Search..." title="Search channels"
            aria-label="Search channels"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-100 dark:bg-slate-800 border border-transparent focus:border-primary/50 rounded-xl focus:outline-none transition-all">
        </div>

        <div class="space-y-4">
          <div class="space-y-2">
            <label for="category-filter" class="text-xs font-semibold text-slate-500 ml-1">Category</label>
            <select id="category-filter" title="Filter by category"
              class="w-full p-2.5 bg-slate-100 dark:bg-slate-800 border border-transparent focus:border-primary/50 rounded-xl focus:outline-none appearance-none cursor-pointer">
              <option value="">All Categories</option>
            </select>
          </div>
          <div class="space-y-2">
            <label for="country-filter" class="text-xs font-semibold text-slate-500 ml-1">Country</label>
            <select id="country-filter" title="Filter by country"
              class="w-full p-2.5 bg-slate-100 dark:bg-slate-800 border border-transparent focus:border-primary/50 rounded-xl focus:outline-none appearance-none cursor-pointer">
              <option value="">All Countries</option>
            </select>
          </div>
          <div class="space-y-2">
            <label for="language-filter" class="text-xs font-semibold text-slate-500 ml-1">Language</label>
            <select id="language-filter" title="Filter by language"
              class="w-full p-2.5 bg-slate-100 dark:bg-slate-800 border border-transparent focus:border-primary/50 rounded-xl focus:outline-none appearance-none cursor-pointer">
              <option value="">All Languages</option>
            </select>
          </div>

          <div class="flex items-center justify-between p-2.5 bg-slate-100 dark:bg-slate-800 rounded-xl">
            <label for="show-blocked" class="text-xs font-semibold text-slate-500 cursor-pointer">Show Blocked</label>
            <div
              class="relative inline-block w-8 h-4 transition duration-200 ease-in-out bg-slate-200 dark:bg-slate-700 rounded-full cursor-pointer">
              <input type="checkbox" id="show-blocked"
                class="absolute w-4 h-4 transition duration-200 ease-in-out bg-white rounded-full appearance-none cursor-pointer checked:translate-x-4 checked:bg-primary ring-1 ring-slate-300 dar[...]
            </div>
          </div>

          <div
            class="flex items-center justify-between p-2.5 bg-primary/10 dark:bg-primary/20 rounded-xl border border-primary/20">
            <label for="show-favorites-only"
              class="text-xs font-semibold text-primary cursor-pointer flex items-center gap-2">
              <i class="fas fa-heart"></i>
              <span>Favorites Only</span>
              <span id="favorites-count-badge"
                class="hidden text-[10px] px-1.5 py-0.5 bg-primary text-white rounded-full">0</span>
            </label>
            <div
              class="relative inline-block w-8 h-4 transition duration-200 ease-in-out bg-slate-200 dark:bg-slate-700 rounded-full cursor-pointer">
              <input type="checkbox" id="show-favorites-only"
                class="absolute w-4 h-4 transition duration-200 ease-in-out bg-white rounded-full appearance-none cursor-pointer checked:translate-x-4 checked:bg-primary ring-1 ring-slate-300 dar[...]
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Tools -->
      <div class="mt-auto pt-6 flex items-center justify-between border-t border-slate-200 dark:border-slate-800">
        <button id="theme-switcher" title="Toggle dark/light mode" aria-label="Toggle dark/light mode"
          class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
          <i class="fas fa-sun text-yellow-500 block dark:hidden"></i>
          <i class="fas fa-moon text-blue-400 hidden dark:block"></i>
        </button>
        <div class="text-[10px] text-slate-400 text-right">
          <p>REBELTV v2.0</p>
          <p>© 2026 Premium IPTV</p>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col min-w-0 overflow-hidden">
      <div class="flex-grow p-4 lg:p-8 overflow-y-auto" id="main-content-scroll">
        <div
          class="sticky top-0 z-30 bg-slate-50/95 dark:bg-slate-950/95 backdrop-blur-md -mx-4 lg:-mx-8 px-4 lg:px-8 py-4 mb-4 border-b border-transparent transition-all duration-300"
          id="content-header">
          <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div class="flex items-center gap-4">
              <button id="expand-sidebar"
                class="hidden lg:flex p-3 bg-white dark:bg-slate-800 rounded-xl shadow-lg border border-white/10 text-primary hover:scale-105 transition-all"
                title="Expand Sidebar">
                <i class="fas fa-bars"></i>
              </button>
              <div>
                <p class="text-sm font-semibold text-primary mb-1">Discover</p>
                <h2 class="text-3xl lg:text-4xl font-bold text-slate-900 dark:text-white">IPTV Browser</h2>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <button id="refresh-data-btn" title="Refresh channel data" aria-label="Refresh data"
                class="p-2.5 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-white/10 text-slate-600 dark:text-slate-400 hover:text-primary hover:scale-105 transition-all">
                <i class="fas fa-sync-alt"></i>
              </button>
              <div id="results-count"
                class="text-sm text-slate-500 bg-slate-100 dark:bg-slate-800 px-3 py-1 rounded-full">
                Loading channels...
              </div>
            </div>
          </div>
        </div>

        <div id="channel-grid"
          class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4 lg:gap-6">
          <!-- Enhanced channel cards injected here -->
        </div>

        <!-- Sentinel element for lazy loading -->
        <div id="load-more-sentinel" class="h-20 w-full flex items-center justify-center mt-8">
          <div class="sentinel-loader hidden">
            <i class="fas fa-circle-notch fa-spin text-primary text-2xl"></i>
          </div>
        </div>

        <!-- Skeleton Loading State -->
        <div id="loading-state" class="grid grid-cols-2 lg:grid-cols-4 gap-6">
          <div class="h-48 bg-slate-200 dark:bg-slate-800 rounded-2xl animate-pulse"></div>
          <div class="h-48 bg-slate-200 dark:bg-slate-800 rounded-2xl animate-pulse"></div>
          <div class="h-48 bg-slate-200 dark:bg-slate-800 rounded-2xl animate-pulse"></div>
          <div class="h-48 bg-slate-200 dark:bg-slate-800 rounded-2xl animate-pulse"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Premium Player Overlay -->
  <div id="player-overlay"
    class="fixed inset-0 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center z-[100] hidden animate-fadeIn">

    <div class="w-full max-w-5xl px-4 flex flex-col">
      <div class="flex items-center justify-between mb-4 w-full">
        <div id="playing-info" class="flex items-center gap-3">
          <div id="playing-logo-container" class="w-10 h-10 rounded-lg bg-white p-1">
            <img id="playing-logo" src="placeholder.png" class="w-full h-full object-contain" alt="">
          </div>
          <div>
            <h3 id="playing-name" class="text-white font-bold text-lg">Stream Name</h3>
            <p id="playing-category" class="text-slate-400 text-xs">General</p>
          </div>
        </div>
        <!-- Source Selector -->
        <div id="source-selector-container" class="mb-4 hidden">
          <p class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2 ml-1">Available Sources</p>
          <div id="source-list" class="flex flex-wrap gap-2">
            <!-- Source buttons will be injected here -->
          </div>
        </div>
        <button id="close-player" aria-label="Close player"
          class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 text-white hover:bg-red-500 transition-colors">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div id="player-container"
        class="aspect-video w-full bg-black rounded-2xl shadow-3xl overflow-hidden ring-1 ring-white/10">
        <video id="video-player" class="video-js vjs-big-play-centered w-full h-full"></video>
      </div>
    </div>
  </div>

  <script src="https://vjs.zencdn.net/7.15.4/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="app.js"></script>
</body>

</html>
